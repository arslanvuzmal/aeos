version: '3.8'

services:
  aeos-postgres:
    image: postgres:15-alpine
    container_name: aeos-postgres
    restart: always
    environment:
      POSTGRES_USER: aeos_admin
      POSTGRES_PASSWORD: aeos_secure_password_2026
      POSTGRES_DB: aeos_kernel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeos_admin -d aeos_kernel"]
      interval: 5s
      timeout: 5s
      retries: 5

  aeos-qdrant:
    image: qdrant/qdrant:latest
    container_name: aeos-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  pgdata:
  qdrant_storage:
